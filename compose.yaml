name: intc-supporter
services:
  db:
    build: ./db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intc_supporter}
      POSTGRES_USER: ${POSTGRES_USER:-intc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intc_local_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build: ./api
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-intc_supporter}
      DB_USER: ${POSTGRES_USER:-intc}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-intc_local_dev}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_LIFETIME_SECONDS: ${SESSION_LIFETIME_SECONDS:-604800}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./api:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
  client:
    build: ./client
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:${CLIENT_PORT:-5173}:5173"
    volumes:
      - ./client:/app
      - client_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  client_modules:
